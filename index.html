<style>
:root{--teal:#0b6e5f;--teal-dark:#064f47;--teal-grad:linear-gradient(135deg,#0c8772 0%,#064f47 100%);--gold:#d4af37;--gold-soft:#f0d785;--chatbg:#e9e2d8;--bot:#fff;--user:#dcf6d3;}

body{font-family:'Poppins','Segoe UI',sans-serif;background:#cfd8d5;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px;background-image:radial-gradient(circle at 20% 10%,#dfe7e4,#bfccc8)}
.wrap{width:100%;max-width:450px;background:var(--chatbg);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(6,79,71,.28);display:flex;flex-direction:column;height:96vh;max-height:880px;position:relative}
.hdr{background:var(--teal-grad);color:#fff;padding:13px 16px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0;position:relative;border-bottom:2px solid var(--gold)}

.hi h3{font-size:15px;font-weight:600;letter-spacing:.2px;line-height:1.2}
.hi .sub{font-size:10.5px;color:#cdeae3;display:flex;align-items:center;gap:5px;margin-top:2px}
.tick{color:var(--gold);font-size:11px}
.dot{width:7px;height:7px;background:#4ade80;border-radius:50%;display:inline-block;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.rst{position:absolute;right:12px;top:14px;background:rgba(255,255,255,.16);border:none;color:#fff;font-size:13px;width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.rst:hover{background:rgba(255,255,255,.3);transform:rotate(-90deg)}
.sb{background:var(--teal-dark);color:#bfe3db;font-size:10px;padding:6px 14px;display:flex;gap:14px;flex-shrink:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
.sb b{color:var(--gold-soft);font-weight:600}
.stpbar{display:none;align-items:center;gap:4px;padding:9px 16px;background:#f3efe8;flex-shrink:0;border-bottom:1px solid #e3ddd2}
.stp{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;transition:.3s}
.stp.done{background:var(--teal);color:#fff}
.stp.active{background:var(--gold);color:#3a2f00;box-shadow:0 0 0 4px rgba(212,175,55,.22)}
.stp.pend{background:#dcd6ca;color:#9c9686}
.stpline{flex:1;height:2px;background:#dcd6ca;transition:.3s}
.stpline.done{background:var(--teal)}
.body{flex:1;overflow-y:auto;padding:12px 10px 90px;background:var(--chatbg);scroll-behavior:smooth}
.body::-webkit-scrollbar{width:4px}.body::-webkit-scrollbar-thumb{background:#c4bcae;border-radius:4px}
.dd{text-align:center;font-size:10px;color:#6f7d79;background:rgba(255,255,255,.7);display:inline-block;padding:3px 12px;border-radius:10px;width:100%;margin:2px 0 8px}
.msg{display:flex;margin-bottom:6px;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.bot{justify-content:flex-start}.msg.user{justify-content:flex-end}
.bub{max-width:86%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.55;position:relative;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.msg.bot .bub{background:var(--bot);border-radius:3px 14px 14px 14px}
.msg.user .bub{background:var(--user);border-radius:14px 3px 14px 14px}
.tm{font-size:9px;color:#9aa6a2;text-align:right;margin-top:3px}
.bub strong,.bub b{color:var(--teal)}

.typ span{width:7px;height:7px;border-radius:50%;background:#bcc6c2;animation:bop 1s infinite}
.typ span:nth-child(2){animation-delay:.15s}.typ span:nth-child(3){animation-delay:.3s}
@keyframes bop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

.card .off{font-size:10px;font-weight:700;color:#3a2f00;background:var(--gold-soft);padding:2px 7px;border-radius:6px}
.card .free{font-size:13px;font-weight:700;color:#1b9e57}
.opencta{display:block;text-align:center;background:var(--teal-grad);color:#fff!important;padding:9px;border-radius:9px;font-size:12.5px;font-weight:600;text-decoration:none;transition:.15s}

.offer b,.offer strong{color:#0b6e5f}
.ctawrap{margin-top:9px;display:flex;flex-direction:column;gap:7px}
.appgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}
.appgrid .cta{padding:9px 6px;font-size:11px}
.cta{display:block;text-align:center;padding:11px;border-radius:10px;font-size:12.5px;font-weight:600;text-decoration:none;border:none;cursor:pointer;transition:.15s}
.cta:hover{transform:translateY(-1px);filter:brightness(1.05)}

const ALIAS={"PUBLIC ADMINISTRATION":["PUBLIC AD","PUBLIC ADM","PUB AD","PUB. AD","LOK PRASHASAN"],"POLITICAL SCIENCE":["POLITICAL SC","POL SC","POL. SC","POL SCIENCE","POLITICS"],"POLITICAL SCIENCE / CIVICS":["POLITICAL SC","POL SC","CIVICS","POLITICS"],"PHYSICAL EDUCATION":["PHYSICAL EDU","PHY EDU","PHY. EDU","PHYSICAL EDUCATION"],"MASS COMMUNICATION":["MASS COMM","JOURNALISM","MASS COMMUNICATION"],"LIBRARY SCIENCE":["LIBRARY SC","LIB SC","LIBRARIAN","LIBRARY SCIENCE"],"HOME SCIENCE":["HOME SC","HOME SCIENCE","GRIH"],"COMPUTER SCIENCE":["COMPUTER SC","COMP SC","COMPUTER SCIENCE","COMPUTER"],"HRM / MANAGEMENT":["HRM","MANAGEMENT","HUMAN RESOURCE","LABOUR WELFARE"],"ENGLISH LITERATURE":["ENGLISH LIT","ENGLISH LITERATURE"],"HINDI LITERATURE":["HINDI LIT","HINDI LITERATURE"],"SOCIAL SCIENCE":["SOCIAL SC","SOCIAL SCIENCE","SST"],"GENERAL":["GENERAL PAPER","RAJASTHAN GK","GENERAL STUDIES","GENERAL KNOWLEDGE"],"PAPER 1":["GENERAL PAPER","PAPER 1","TEACHING & RESEARCH","TEACHING AND RESEARCH"]};
function subjKey(s){if(!s)return "";let x=s.split("/")[0];x=x.replace(/—.*/,"").replace(/\(.*?\)/g,"").trim();return x.toUpperCase();}
function isGeneric(k){return !k||/\b(OTHER|COMPLETE|PRELIM|PRELIMS|MAIN|MAINS|PACKAGE|ONLY|OPTIONAL)\b/.test(k);}
function subjMatch(T,subject){const raw=subjKey(subject);if(!raw)return true;const full=subject.split("/")[0].replace(/\(.*?\)/g,"").trim().toUpperCase();if(ALIAS[full])return ALIAS[full].some(a=>T.includes(a));if(ALIAS[raw])return ALIAS[raw].some(a=>T.includes(a));const toks=raw.split(/[^A-Z0-9]+/).filter(w=>w.length>=3&&!["AND","THE","FOR","OPTIONAL"].includes(w));if(toks.length===0){return new RegExp("\\b"+raw.replace(/[^A-Z0-9]/g,"")+"\\b").test(T);}const t0=toks[0];const t0ok=(t0.length<=3)?new RegExp("\\b"+t0+"\\b").test(T):(T.includes(t0)||T.includes(t0.slice(0,4)));if(!t0ok)return false;if(toks.length===1)return true;const t1=toks[1];return T.includes(t1.slice(0,Math.min(3,t1.length)));}
function priceLine(c){if(c.isFreeCourse||c.finalPrice===0)return '<span class="free">FREE</span>';const f=(c.finalPrice!=null?c.finalPrice:c.price),o=c.price;if(o&&o>f){const pct=c.discountPercentage?'<span class="off">'+Math.round(c.discountPercentage)+'% OFF</span>':'';return '<span class="now">₹'+f+'</span><span class="was">₹'+o+'</span>'+pct;}return '<span class="now">₹'+f+'</span>';}

function rank(arr,m){return arr.slice().sort((a,b)=>{const x=medScore(b,m)-medScore(a,m);if(x)return x;const fa=a.finalPrice!=null?a.finalPrice:a.price,fb=b.finalPrice!=null?b.finalPrice:b.price;return fa-fb;});}

function prodPass(c,prod){const _nm=(c.name||"").toUpperCase();if(["E-NOTES","E NOTES","E-NOTE","E NOTE","E-BOOK","E BOOK","READ ONLY"].some(k=>_nm.includes(k)))return false;if(prod==="online"||prod==="combo"){if(txtOf(c).includes("TEST SERIES"))return false;return true;}const PK={enotes:["E-BOOK","E BOOK","E-NOTES","E NOTES","CLASS NOTES","E NOTE","DIGITAL"],hardcopy:["HARD COPY"],tests:["TEST SERIES"]};const pk=PK[prod];if(pk)return pk.some(k=>txtOf(c).includes(k));return true;}

function tieredMatch(cat,leaf,subject,prod,medium){const typed=(A.typed||"").toUpperCase().trim();const primary=(leaf.primaryKW||[]).slice();if(typed)primary.push(typed);const family=leaf.familyKW||[];
  if(isGeneralSubject(subject)){const fam=leaf.subjects;const examKW=primary.concat(family);const base=cat.filter(c=>prodPass(c,prod)&&/GENERAL PAPER|RAJASTHAN GK|GENERAL STUDIES/.test(txtOf(c)));let g=base.filter(c=>kwAny(c,examKW));if(["ap","rpsc1","rpsc2"].indexOf(fam)>=0)g=g.concat(base.filter(c=>txtOf(c).includes("RAJASTHAN GK")));g=dedupe(g);if(g.length)return {list:rank(g,medium).slice(0,6),tier:1};let gf=dedupe(base.filter(c=>kwAny(c,family)));if(gf.length)return {list:rank(gf,medium).slice(0,6),tier:2};return {list:[],tier:3};}
  const generic=isGeneric(subjKey(subject));const subjOK=c=>generic||subjMatch(txtOf(c),subject);let t1=dedupe(cat.filter(c=>primary.length&&kwAny(c,primary)&&prodPass(c,prod)&&subjOK(c)));if(t1.length)return {list:rank(t1,medium).slice(0,6),tier:1};let t2=dedupe(cat.filter(c=>kwAny(c,family)&&prodPass(c,prod)&&subjOK(c)));t2.sort((a,b)=>comboScore(b)-comboScore(a)||(medScore(b,medium)-medScore(a,medium)));if(t2.length)return {list:rank(t2,medium).slice(0,6),tier:2};return {list:[],tier:3};}

async function sendMsg(){const inp=document.getElementById("inp");const txt=(inp.value||"").trim();if(!txt)return;inp.value="";addMsg("user",txt);if(phase==="lang"){if(/hin|हि/i.test(txt))await setLang("hi");else await setLang("en");return;}if(phase==="lead"){rmOpts();if(isPhone(txt)){await captureLead(txt);}else{await say(L==="hi"?"कृपया सही 10-अंकों का WhatsApp नंबर भेजें 🙏":"Please send a valid 10-digit WhatsApp number 🙏",450);} return;}
  if(phase==="query"){rmOpts();await gotQuery(txt);return;}if(phase==="typed"){rmOpts();await gotTyped(txt);return;}if(phase==="subject"){rmOpts();await gotSubject(txt);return;}
