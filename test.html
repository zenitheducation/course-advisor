async function fetchApp(k){
  if(_cat[k])return _cat[k];
  try{const r=localStorage.getItem("zc_"+k);if(r){const o=JSON.parse(r);if(Date.now()-o.t<1800000&&o.d&&o.d.length){_cat[k]=o.d;return o.d;}}}catch(e){}

  return d;}

 "COMPUTER SCIENCE":["COMPUTER SC","COMP SC","COMPUTER SCIENCE","COMPUTER"],
 "HRM / MANAGEMENT":["HRM","MANAGEMENT","HUMAN RESOURCE","LABOUR WELFARE"],
 "ENGLISH LITERATURE":["ENGLISH LIT","ENGLISH LITERATURE"],
 "HINDI LITERATURE":["HINDI LIT","HINDI LITERATURE"],
 "SOCIAL SCIENCE":["SOCIAL SC","SOCIAL SCIENCE","SST"]
};
function subjKey(s){if(!s)return "";let x=s.split("/")[0];x=x.replace(/—.*/,"").replace(/\(.*?\)/g,"").trim();return x.toUpperCase();}
function isGeneric(k){return !k||/\b(OTHER|COMPLETE|PRELIM|PRELIMS|MAIN|MAINS|PAPER|PACKAGE|GENERAL|ONLY|OPTIONAL)\b/.test(k);}
function subjMatch(T,subject){
  const raw=subjKey(subject);if(!raw)return true;
  const full=subject.split("/")[0].replace(/\(.*?\)/g,"").trim().toUpperCase();
  if(ALIAS[full])return ALIAS[full].some(a=>T.includes(a));
  if(ALIAS[raw])return ALIAS[raw].some(a=>T.includes(a));
  const toks=raw.split(/[^A-Z0-9]+/).filter(w=>w.length>=3&&!["AND","THE","FOR","OPTIONAL"].includes(w));
  if(toks.length===0){return new RegExp("\\b"+raw.replace(/[^A-Z0-9]/g,"")+"\\b").test(T);}
  const t0=toks[0];
  const t0ok=(t0.length<=3)?new RegExp("\\b"+t0+"\\b").test(T):(T.includes(t0)||T.includes(t0.slice(0,4)));
  if(!t0ok)return false;
  if(toks.length===1)return true;
  const t1=toks[1];return T.includes(t1.slice(0,Math.min(3,t1.length)));
}

function priceLine(c){
  if(c.isFreeCourse||c.finalPrice===0)return '<span class="free">FREE</span>';
  const f=(c.finalPrice!=null?c.finalPrice:c.price),o=c.price;
  if(o&&o>f){const pct=c.discountPercentage?'<span class="off">'+c.discountPercentage+'% OFF</span>':'';
    return '<span class="now">₹'+f+'</span><span class="was">₹'+o+'</span>'+pct;}
  return '<span class="now">₹'+f+'</span>';}
function medScore(c,m){const T=(c.name||"").toUpperCase();if(m==="Hindi")return T.includes("HINDI")?2:(T.includes("BOTH")?1:0);if(m==="English")return T.includes("ENGLISH")?2:(T.includes("BOTH")?1:0);return T.includes("BOTH")?1:0;}
function comboScore(c){const T=txtOf(c);return (T.includes("COMBO")?2:0)+(T.includes("MASTER NOTES")?1:0);}
function rank(arr,m){return arr.slice().sort((a,b)=>{const x=medScore(b,m)-medScore(a,m);if(x)return x;const fa=a.finalPrice!=null?a.finalPrice:a.price,fb=b.finalPrice!=null?b.finalPrice:b.price;return fa-fb;});}
function card(c){return '<div class="card"><div class="nm">'+(c.name||"Course")+'</div><div class="pr">'+priceLine(c)+'</div>'+

function prodPass(c,prod){
  if(prod==="online"||prod==="combo"){if(txtOf(c).includes("TEST SERIES"))return false;return true;}
  const PK={enotes:["E-BOOK","E BOOK","E-NOTES","E NOTES","CLASS NOTES","E NOTE","DIGITAL"],hardcopy:["HARD COPY"],tests:["TEST SERIES"]};
  const pk=PK[prod];if(pk)return pk.some(k=>txtOf(c).includes(k));return true;}
function kwAny(c,arr){const T=txtOf(c);return arr.some(k=>T.includes(k));}
function dedupe(a){const s={};return a.filter(c=>s[c.id]?false:(s[c.id]=1));}
function tieredMatch(cat,leaf,subject,prod,medium){
  const typed=(A.typed||"").toUpperCase().trim();
  const primary=(leaf.primaryKW||[]).slice();if(typed)primary.push(typed);
  const family=leaf.familyKW||[];
  const generic=isGeneric(subjKey(subject));
  const subjOK=c=>generic||subjMatch(txtOf(c),subject);
  let t1=dedupe(cat.filter(c=>primary.length&&kwAny(c,primary)&&prodPass(c,prod)&&subjOK(c)));
  if(t1.length)return {list:rank(t1,medium).slice(0,6),tier:1};
  let t2=dedupe(cat.filter(c=>kwAny(c,family)&&prodPass(c,prod)&&subjOK(c)));
  t2.sort((a,b)=>comboScore(b)-comboScore(a)||(medScore(b,medium)-medScore(a,medium)));
  if(t2.length)return {list:rank(t2,medium).slice(0,6),tier:2};
  return {list:[],tier:3};
}
function appsFor(prod){if(prod==="online"||prod==="combo")return ["online"];if(prod==="enotes"||prod==="hardcopy")return ["notes"];return ["online","notes"];}
function onlineHasFor(leaf,subject){
  const oc=_cat.online||[];if(oc.length<200)return null;
  const typed=(A.typed||"").toUpperCase().trim();
  const kws=(leaf.primaryKW||[]).concat(leaf.familyKW||[]);if(typed)kws.push(typed);
  const generic=isGeneric(subjKey(subject));
  let pool=oc.filter(c=>kwAny(c,kws)&&!txtOf(c).includes("TEST SERIES"));
  if(!generic)pool=pool.filter(c=>subjMatch(txtOf(c),subject));
  return pool.length>0;}
