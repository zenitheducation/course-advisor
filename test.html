<title>Zenith Education — Course Advisor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#e5ddd5;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:8px}
.wrap{width:100%;max-width:440px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;height:95vh;max-height:840px}
.hdr{background:#075e54;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative}
.av{width:44px;height:44px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hi h3{font-size:14px;font-weight:600}
.hi small{font-size:10.5px;color:#b2dfdb}
.dot{width:7px;height:7px;background:#4caf50;border-radius:50%;display:inline-block;margin-right:3px}
.rst{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);border:none;color:#fff;font-size:10px;padding:3px 8px;border-radius:10px;cursor:pointer}
.sb{background:#004d40;color:#b2dfdb;font-size:10px;padding:4px 14px;display:flex;gap:12px;flex-shrink:0;overflow-x:auto;white-space:nowrap}
.sb span strong{color:#80cbc4}

/* Step bar */
.stpbar{display:none;align-items:center;gap:3px;padding:6px 14px;background:#f5f5f5;flex-shrink:0;border-bottom:1px solid #e0e0e0}
.stp{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;transition:all .3s}
.stp.done{background:#25d366;color:#fff}
.stp.active{background:#075e54;color:#fff}
.stp.pend{background:#ddd;color:#999}
.stpline{flex:1;height:2px;background:#ddd;transition:background .3s}
.stpline.done{background:#25d366}

/* Chat */
.body{flex:1;overflow-y:auto;padding:9px 8px 80px 8px;background:#e5ddd5;scroll-behavior:smooth}
.body::-webkit-scrollbar{width:3px}
.body::-webkit-scrollbar-thumb{background:#bbb;border-radius:3px}
.dd{text-align:center;font-size:10.5px;color:#666;background:rgba(255,255,255,.75);display:inline-block;padding:2px 10px;border-radius:8px;width:100%;margin:4px 0}
.msg{display:flex;margin-bottom:4px}
.msg.bot{justify-content:flex-start}
.msg.user{justify-content:flex-end}
.bub{max-width:85%;padding:7px 11px;border-radius:8px;font-size:12.5px;line-height:1.55;position:relative;word-break:break-word}
.msg.bot .bub{background:#fff;border-radius:0 8px 8px 8px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.msg.user .bub{background:#dcf8c6;border-radius:8px 0 8px 8px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tm{font-size:9.5px;color:#999;text-align:right;margin-top:2px}
.bub strong{color:#075e54}
.typ{background:#fff;border-radius:0 8px 8px 8px;padding:9px 13px;display:inline-flex;gap:4px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.typ span{width:6px;height:6px;border-radius:50%;background:#aaa;animation:bop 1s infinite}
.typ span:nth-child(2){animation-delay:.15s}
.typ span:nth-child(3){animation-delay:.3s}
@keyframes bop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* Options - FIXED: use button with full display */
.optswrap{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 8px 4px;margin-top:4px}
.obtn{background:#fff;border:1.5px solid #25d366;color:#075e54;padding:7px 13px;border-radius:18px;font-size:12.5px;cursor:pointer;font-weight:500;line-height:1.3;transition:background .15s,color .15s;text-align:left;display:inline-block;-webkit-tap-highlight-color:rgba(37,211,102,.2)}
.obtn:hover,.obtn:active{background:#25d366;color:#fff}
.obtn.full{width:100%;border-radius:8px}

/* CTA links */
.ctawrap{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.cta{display:block;text-align:center;padding:10px 14px;border-radius:9px;font-size:13px;font-weight:600;text-decoration:none;border:none;cursor:pointer;-webkit-tap-highlight-color:rgba(0,0,0,.1)}
.cta:hover,.cta:active{opacity:.85}
.cwa{background:#25d366;color:#fff !important}
.cweb{background:#075e54;color:#fff !important}
.ccall{background:#ff9800;color:#fff !important}
.ca1{background:#1565c0;color:#fff !important}
.ca2{background:#4527a0;color:#fff !important}
.csm{background:#e65100;color:#fff !important}

/* Footer */
.ft{background:#f0f0f0;padding:7px 9px;display:flex;gap:7px;align-items:center;border-top:1px solid #ddd;flex-shrink:0}
.ft input{flex:1;padding:8px 13px;border-radius:22px;border:none;background:#fff;font-size:13px;outline:none;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.snd{width:38px;height:38px;border-radius:50%;border:none;background:#25d366;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

hr.d{border:none;border-top:1px solid #eee;margin:5px 0}
.badge{display:inline-block;background:#e8f5e9;color:#2e7d32;border-radius:5px;padding:1px 6px;font-size:10.5px;font-weight:600;margin:1px 2px 1px 0}
.offer{background:#fff8e1;border:1.5px solid #ffc107;border-radius:8px;padding:9px 11px;margin-top:7px;font-size:12px;line-height:1.5}
.row{border-bottom:1px solid #f0f0f0;padding:4px 0;font-size:12px;line-height:1.4}
.row:last-child{border:none}
.pr{color:#b71c1c;font-weight:700}
.op{color:#aaa;text-decoration:line-through;font-size:10.5px}
.disc{color:#2e7d32;font-size:10.5px;font-weight:600}
</style>

function now(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
function $body(){return document.getElementById("body");}
function scrollDown(){const b=$body();setTimeout(()=>{b.scrollTop=b.scrollHeight;},50);}

function addMsg(who,html){
  const d=document.createElement("div");d.className="msg "+who;
  const b=document.createElement("div");b.className="bub";
  b.innerHTML=html+`<div class="tm">${now()}${who==="user"?" ✓✓":""}</div>`;
  d.appendChild(b);$body().appendChild(d);scrollDown();
}

function addOpts(arr){
  rmOpts();
  const w=document.createElement("div");w.className="optswrap";w.id="opts";
  arr.forEach(o=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="obtn"+(o.full?" full":"");
    btn.innerHTML=o.l;
    btn.addEventListener("click",function(){
      rmOpts();
      addMsg("user",this.textContent);
      setTimeout(o.a,300);
    });
    w.appendChild(btn);
  });
  $body().appendChild(w);
  scrollDown();
  // Extra scroll after a tick to ensure visibility
  setTimeout(()=>{
    const opts=document.getElementById("opts");
    if(opts) opts.scrollIntoView({behavior:"smooth",block:"end"});
  },100);
}

function rmOpts(){const o=document.getElementById("opts");if(o)o.remove();}

function typing(ms=700){
  return new Promise(r=>{
    const d=document.createElement("div");d.className="msg bot";d.id="typdiv";
    d.innerHTML='<div class="typ"><span></span><span></span><span></span></div>';
    $body().appendChild(d);scrollDown();
    setTimeout(()=>{d.remove();r();},ms);
  });
}

async function say(html,ms=700){await typing(ms);addMsg("bot",html);}

function addCTA(html){
  const d=document.createElement("div");d.className="msg bot";
  d.innerHTML=`<div class="bub">${html}<div class="tm">${now()}</div></div>`;
  $body().appendChild(d);scrollDown();

}

  setTimeout(doMore,500);

// ════════════════ LIVE CATALOG ENGINE ════════════════
const ORG={online:10248,notes:297525};
const APIBASE="https://api.classplusapp.com/v2/course/preview/similar/";
let _cat={};
function _tok(org){return btoa(JSON.stringify({tutorId:null,orgId:org,categoryId:null}));}
async function fetchApp(key){
  if(_cat[key]) return _cat[key];
  try{const raw=localStorage.getItem("zcat_"+key);if(raw){const o=JSON.parse(raw);if(Date.now()-o.t<1800000&&o.d&&o.d.length){_cat[key]=o.d;return o.d;}}}catch(e){}
  const url=APIBASE+_tok(ORG[key])+"?limit=400&offset=0";
  const r=await fetch(url,{headers:{accept:'application/json'}});
  const j=await r.json();
  const d=(j&&j.data&&j.data.coursesData)||[];
  if(d.length){_cat[key]=d; try{localStorage.setItem("zcat_"+key,JSON.stringify({t:Date.now(),d}));}catch(e){}}
  return d;
}
async function getCatalogs(apps){const out=[];for(const a of apps){try{const d=await fetchApp(a);d.forEach(c=>out.push(Object.assign({_app:a},c)));}catch(e){}}return out;}

const EXKW={
  ap:["ASSISTANT PROFESSOR"],
  pgt:["PGT","TGT"," TET"," PRT","KVS","NVS","EMRS"],
  rpsc1:["1ST GRADE","FIRST GRADE","SCHOOL LECTURER"],
  rpsc2:["2ND GRADE","SENIOR TEACHER"],
  net:["UGC NET","NET JRF","NET/JRF","CSIR","NTA-UGC"," SET "," SLET"],
  ras:["RAS ","RAS-","RAS+","RAS,","RAS(","RAS PRE","RAS MAIN","RAS PRELIM","RAJASTHAN EXAM","STATE PCS"],
  rssb:["RSSB","JVVNL","JUNIOR ACCOUNTANT"," CET","CET ","P.S.I","PSI","COMPUTER INSTRUCTOR","PATWAR"]
};
const PRODKW={
  enotes:["E-BOOK","E BOOK","E-NOTES","E NOTES","CLASS NOTES","E NOTE","DIGITAL"],
  hardcopy:["HARD COPY"],
  tests:["TEST SERIES"]
};
function txtOf(c){return ((c.name||"")+" || "+(c.categories||"")).toUpperCase();}
function matchExam(c,exam){const T=txtOf(c);return (EXKW[exam]||[]).some(k=>T.includes(k));}
function subjKey(subject){
  if(!subject) return "";
  let s=subject.split("/")[0];
  s=s.replace(/—.*/,"").replace(/\(.*?\)/g,"").trim();
  return s.toUpperCase();
}
// Does an ONLINE course exist for this exam (+subject)? Used to decide whether to offer it.
function onlineHasFor(exam,subject){
  const oc=_cat.online||[];
  if(oc.length<200) return null; // unknown / incomplete fetch -> show online to be safe
  const key=subjKey(subject);
  let pool=oc.filter(c=>matchExam(c,exam) && !txtOf(c).includes("TEST SERIES"));
  if(key) pool=pool.filter(c=>txtOf(c).includes(key));
  return pool.length>0;
}
function priceLine(c){
  if(c.isFreeCourse||c.finalPrice===0) return '<span class="disc">FREE</span>';
  const f=(c.finalPrice!=null?c.finalPrice:c.price);
  const orig=c.price;
  if(orig&&orig>f){
    const pct=c.discountPercentage?(' <span class="disc">'+c.discountPercentage+'% OFF</span>'):'';
    return '<span class="pr">₹'+f+'</span> <span class="op">₹'+orig+'</span>'+pct;
  }
  return '<span class="pr">₹'+f+'</span>';
}
function medScore(c,medium){
  const T=(c.name||"").toUpperCase();
  if(medium==="Hindi") return T.includes("HINDI")?2:(T.includes("BOTH")?1:0);
  if(medium==="English") return T.includes("ENGLISH")?2:(T.includes("BOTH")?1:0);
  return T.includes("BOTH")?1:0;
}
function matchCourses(pool,exam,subject,prod,medium){
  let cand=pool.filter(c=>matchExam(c,exam));
  if(prod==="online"||prod==="combo") cand=cand.filter(c=>!txtOf(c).includes("TEST SERIES"));
  const pk=PRODKW[prod];
  if(pk) cand=cand.filter(c=>pk.some(k=>txtOf(c).includes(k)));
  const seen={}; cand=cand.filter(c=>{if(seen[c.id])return false;seen[c.id]=1;return true;});
  const key=subjKey(subject);
  let hits = key? cand.filter(c=>txtOf(c).includes(key)) : cand;
  let exact=true;
  if(key && hits.length===0){ hits=cand; exact=false; }
  hits.sort((a,b)=>{
    const m=medScore(b,medium)-medScore(a,medium); if(m) return m;
    const fa=a.finalPrice!=null?a.finalPrice:a.price, fb=b.finalPrice!=null?b.finalPrice:b.price;
    return fa-fb;
  });
  return {list:hits.slice(0,6), exact, total:hits.length};
}
